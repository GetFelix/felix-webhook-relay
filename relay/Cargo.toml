[package]
name = "felix-relay"
version = "0.1.0"
description = "A webhook relay whose backend is Felix"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64.workspace = true
axum = "0.8"
hex = "0.4"
felix-client = "0.6.0-preview.4"
felix-relay-core.workspace = true
felix-wire = "0.6.0-preview.4"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "json"] }
rustls = "0.23"
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
standardwebhooks = "1"
hmac = "0.12"
sha2 = "0.10"

