name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Job names are required checks on main. Rename them only together with the
# branch protection rule.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test --locked --no-run
      - name: Start Felix
        run: dev/up.sh
      - name: Integration tests
        run: |
          export RELAY_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          cargo test --locked --tests -- --include-ignored
      - name: Felix logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs

  # The design's demonstrations at full size. Not a required check: they
  # take minutes, and the integration job already runs each one small.
  demonstrations:
    name: demonstrations
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test --locked --no-run
      - name: Start Felix
        run: dev/up.sh
      - name: Outage, 10,000 webhooks
        env:
          RELAY_TEST_WEBHOOKS: "10000"
          RELAY_TEST_OUTAGE: 60s
        run: |
          export RELAY_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          cargo test --locked --test outage -- --include-ignored an_endpoint_that_was_down
      - name: Slow endpoint isolation, 1,000 webhooks
        env:
          RELAY_TEST_ISOLATION_WEBHOOKS: "1000"
        run: |
          export RELAY_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          RELAY_TIMINGS=1 cargo test --locked --test isolation -- --include-ignored --nocapture 2>&1 | tee iso.log | grep -v "^T " ; grep "^T " iso.log | python3 scripts-timings.py
      - name: Offset for a time, 10 million records
        env:
          RELAY_TEST_SEARCH_RECORDS: "10000000"
        run: |
          export RELAY_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          cargo test --locked --test replay -- --include-ignored --nocapture the_offset_for_a_time
      - name: Performance measurements
        env:
          RELAY_TEST_PERF: "1"
        run: |
          export RELAY_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          cargo test --locked --release --test load -- --include-ignored --nocapture measure
      - name: Felix logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs

  # Demonstration 5 and the retention guard each need a stack of their own:
  # three brokers to kill, and a broker that keeps records for seconds. Not
  # required checks: they take minutes and restart Docker containers.
  crash-and-retention:
    name: crash and retention
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test --locked --no-run
      - name: Start three brokers
        run: dev/up.sh --cluster
      - name: Kill intake, a worker and each broker under load
        env:
          RELAY_TEST_CLUSTER: "1"
        run: |
          export RELAY_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          cargo test --locked --test crash -- --include-ignored --nocapture
      - name: Start a broker with seconds of retention
        run: dev/up.sh --retention
      - name: Short retention is reported
        env:
          RELAY_TEST_RETENTION: "1"
        run: |
          export RELAY_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          cargo test --locked --test retention -- --include-ignored --nocapture
      - name: Felix logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml -f dev/docker-compose.cluster.yml logs
