# Opens a "chore: use Felix <version>" PR when GetFelix/felix publishes a
# release. The work is in GetFelix/.github's felix-bump.yml; this repo's pins
# are in .felix-version and .github/felix-bump.sh.
name: Felix release

on:
  repository_dispatch:
    types: [felix-release]
  workflow_dispatch:
    inputs:
      version:
        description: Felix version without the leading v, e.g. 0.6.1
        required: true
        type: string
      prerelease:
        description: The release is a prerelease
        type: boolean
        default: false
      test_pr:
        description: Only open a draft test PR, to check the bot and CI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bump:
    uses: GetFelix/.github/.github/workflows/felix-bump.yml@main
    with:
      version: ${{ github.event.client_payload.version || inputs.version }}
      prerelease: ${{ github.event.client_payload.prerelease == true || inputs.prerelease == true }}
      test_pr: ${{ inputs.test_pr == true }}
    secrets: inherit
