{{- $name := printf "%s-deliver" (include "relay.fullname" .) -}}
# A StatefulSet, so each worker index has at most one pod: two workers on one
# index would split its endpoints' groups and break their order.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: deliver
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.deliver.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "relay.selector" (list . "deliver") | nindent 6 }}
  template:
    {{- include "relay.pod" (list . "deliver" .Values.deliver (include "relay.deliverEnv" .)) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: deliver
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8090
  selector:
    {{- include "relay.selector" (list . "deliver") | nindent 4 }}
