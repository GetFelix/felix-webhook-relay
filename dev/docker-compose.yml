# Felix for local development and CI: a control plane, one broker, a stand-in
# IdP, and a one-shot seed that creates the demo tenant's streams and caches
# and the relay's token. `dev/up.sh` starts it and waits for the broker.
name: felix-webhook-relay

services:
  # The stand-in IdP is only a key set. The seed generates the key, publishes
  # the public half here, and signs the ID tokens it exchanges itself.
  idp:
    image: busybox:stable
    command: ["httpd", "-f", "-p", "9400", "-h", "/www"]
    volumes:
      - ./state/idp:/www:ro

  controlplane:
    image: ghcr.io/gabloe/felix-controlplane:0.6.0-preview
    environment:
      # In-memory store: a restart of the stack starts from nothing.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 0.0.0.0:9095
      FELIX_BOOTSTRAP_TOKEN: dev-bootstrap
      # The dev IdP is plain HTTP on the compose network and signs with RS256,
      # which openssl can do from a shell.
      FELIX_CONTROLPLANE_OIDC_ALLOW_INSECURE_HTTP: "true"
      FELIX_CONTROLPLANE_OIDC_ALLOWED_ALGORITHMS: RS256
      # The broker reads its credential once at startup, so the default 15
      # minutes would end a dev session early (felix#955).
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "86400"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      - idp

  seed:
    image: alpine:3.22
    command: ["sh", "-c", "apk add --no-cache --quiet curl jq openssl && sh /app/seed.sh"]
    volumes:
      - ./seed.sh:/app/seed.sh:ro
      - ./state:/state
    depends_on:
      controlplane:
        condition: service_healthy

  broker:
    image: ghcr.io/gabloe/felix-broker:0.6.0-preview
    environment:
      FELIX_CONTROLPLANE_URL: http://controlplane:8443
      FELIX_NODE_TOKEN_FILE: /state/node.token
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix
      FELIX_TLS_CERT_EXPORT: /state/broker-cert.pem
      # One listener, so the one published UDP port is the only one clients use.
      FELIX_QUIC_LISTENERS: "1"
      RUST_LOG: info
    ports:
      - "127.0.0.1:5000:5000/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./state:/state
      - felix-data:/var/lib/felix
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  felix-data:
