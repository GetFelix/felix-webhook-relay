# Felix for local development and CI: a control plane, one broker, Dex for
# admins to sign in with, a stand-in IdP for the relay's own token, and a
# one-shot run of deploy/seed.sh that creates the relay tenants' namespaces,
# streams, caches and roles. `dev/up.sh` starts it and waits for the broker
# and Dex.
name: felix-webhook-relay

services:
  # The stand-in IdP is only a key set. The seed generates the key, publishes
  # the public half here, and signs the ID tokens it exchanges itself.
  idp:
    image: busybox:stable
    command: ["httpd", "-f", "-p", "9400", "-h", "/www"]
    volumes:
      - ./state/idp:/www:ro

  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"

  controlplane:
    image: ghcr.io/getfelix/felix-controlplane:0.6.0-preview.2
    environment:
      # In-memory store: a restart of the stack starts from nothing.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 0.0.0.0:9095
      FELIX_BOOTSTRAP_TOKEN: dev-bootstrap
      # The dev IdP is plain HTTP on the compose network.
      FELIX_CONTROLPLANE_OIDC_ALLOW_INSECURE_HTTP: "true"
      # The seed writes the broker's token once, so the default 15 minutes
      # would end a dev session early.
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "86400"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      - idp
      - dex

  seed:
    image: alpine:3.22
    command: ["sh", "-c", "apk add --no-cache --quiet curl jq openssl && sh /app/seed.sh"]
    environment:
      TOKENS_ISSUER: http://idp:9400
      RELAY_TENANTS: acme,globex
      # Alice administers acme, bob globex, and carol nothing.
      RELAY_TENANT_ADMINS: acme=alice@example.com globex=bob@example.com
      RELAY_OIDC_ISSUER: http://127.0.0.1:5556/dex
      RELAY_OIDC_JWKS_URL: http://dex:5556/dex/keys
      BROKER_CERT_SAN: DNS:localhost,IP:127.0.0.1
      # The relay runs on the host and reads this token for a dev session.
      RELAY_TOKEN_LIFETIME_SECONDS: "2592000"
      SEED_TEST_TOKENS: "1"
    volumes:
      - ../deploy/seed.sh:/app/seed.sh:ro
      - ./state:/state
    depends_on:
      controlplane:
        condition: service_healthy
      dex:
        condition: service_started

  broker:
    image: ghcr.io/getfelix/felix-broker:0.6.0-preview.2
    environment:
      FELIX_CONTROLPLANE_URL: http://controlplane:8443
      FELIX_NODE_TOKEN_FILE: /state/node.token
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix
      FELIX_TLS_CERT: /state/broker-cert.pem
      FELIX_TLS_KEY: /state/broker-key.pem
      # One listener, so the one published UDP port is the only one clients use.
      FELIX_QUIC_LISTENERS: "1"
      # Short, so tests see claims lapse while a worker retries. A relay on
      # this stack sets RELAY_CLAIM_WAIT_MS=5000 to match.
      FELIX_GROUP_VISIBILITY_TIMEOUT_MS: "5000"
      # Tests make a stream per source, and each segment would otherwise
      # reserve its full size on disk up front.
      FELIX_DURABLE_PREALLOCATE: "false"
      # What the relay recommends: an acknowledged webhook is on the device,
      # and the acknowledgement waits for that. Group commit keeps it cheap.
      FELIX_DURABLE_FSYNC_MODE: on_commit
      FELIX_ACK_ON_COMMIT: "true"
      RUST_LOG: info
    ports:
      - "127.0.0.1:5000:5000/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./state:/state
      - felix-data:/var/lib/felix
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  felix-data:
